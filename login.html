<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in / Sign up - Griffin Vocab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Griffin Vocab</h1>

    <div id="auth-section">
        <h2 id="auth-title">Log in</h2>

        <form id="auth-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Log in</button>
        </form>

        <p>
            <span id="toggle-text">No account yet?</span>
            <a href="#" id="toggle-link">Sign up</a>
        </p>

        <p id="message"></p>
    </div>

    <p><a href="index.html">Back to Home</a></p>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const supabase = createClient(
            'https://hjlnubicstqnlappbrjc.supabase.co',
            'sb_publishable_oyxAGzlhR4oXmhH8rrs0rw_uHMbzsVx'
        )

        let isLoginMode = true

        const form = document.getElementById('auth-form')
        const emailInput = document.getElementById('email')
        const passwordInput = document.getElementById('password')
        const submitBtn = document.getElementById('submit-btn')
        const authTitle = document.getElementById('auth-title')
        const toggleText = document.getElementById('toggle-text')
        const toggleLink = document.getElementById('toggle-link')
        const message = document.getElementById('message')

        // 切换登录 / 注册
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault()
            isLoginMode = !isLoginMode
            authTitle.textContent = isLoginMode ? 'Log in' : 'Sign up'
            submitBtn.textContent = isLoginMode ? 'Log in' : 'Sign up'
            toggleText.textContent = isLoginMode ? 'No account yet?' : 'Already have an account?'
            toggleLink.textContent = isLoginMode ? 'Sign up' : 'Log in'
            message.textContent = ''
        })

        // 提交表单
        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            message.textContent = 'Processing...'

            const email = emailInput.value
            const password = passwordInput.value

            let result
            if (isLoginMode) {
                result = await supabase.auth.signInWithPassword({ email, password })
            } else {
                result = await supabase.auth.signUp({ email, password })
            }

            if (result.error) {
                message.textContent = 'Error: ' + result.error.message
                return
            }

            if (isLoginMode) {
                message.textContent = 'Login successful, redirecting...'
                window.location.href = 'index.html'
            } else {
                message.textContent = 'Sign up successful! Please check your email for confirmation (if email verification is enabled), then log in.'
            }
        })
    </script>
</body>
</html>
