<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Mode</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p><a id="back-link" href="index.html">← Back</a></p>

    <h1 id="deck-title">Loading...</h1>

    <button id="favorite-btn">Favorite</button>
    <button id="practice-btn-top" style="display:none;">Practice mode</button>

    <div id="study-area" style="display:none;">
        <p id="progress"></p>

        <div id="flashcard" class="flashcard">
            <div class="flashcard-inner">
                <div class="flashcard-face flashcard-front">
                    <span id="card-front-text">...</span>
                </div>
                <div class="flashcard-face flashcard-back">
                    <span id="card-back-text"></span>
                </div>
            </div>
        </div>

        <p id="hint">Click the card to flip</p>

        <div id="answer-buttons" style="display:none;">
            <button id="know-btn">Know</button>
            <button id="dont-know-btn">Don't Know</button>
        </div>
    </div>

    <p id="done-message" style="display:none;"></p>

    <section id="comments-section" style="display:none;">
        <h2>Comments</h2>

        <form id="comment-form">
            <textarea id="comment-input" rows="3"
                placeholder="Share your understanding, memory tips, or questions about this deck..." maxlength="1000"
                required></textarea>
            <button type="submit">Post</button>
        </form>
        <p id="comment-message"></p>

        <div id="comments-list">Loading...</div>
    </section>

    <section id="practice-area" style="display:none;">
        <div id="practice-main">
            <div class="practice-topbar">
                <span id="practice-progress"></span>
                <span id="practice-score"></span>
            </div>

            <div class="practice-card">
                <div class="practice-prompt-label">Which meaning matches this word?</div>
                <div id="practice-word" class="practice-word"></div>
            </div>

            <div id="practice-options" class="practice-options"></div>

            <div id="practice-feedback" class="practice-feedback"></div>

            <button id="practice-next-btn" style="display:none;">Next question</button>
        </div>

        <div id="practice-result" style="display:none;"></div>
    </section>

    <script type="module">

        import { supabase, requireLogin } from './script.js'

        const currentUser = await requireLogin()
        if (!currentUser) throw new Error('Not logged in, redirecting...')

        const params = new URLSearchParams(window.location.search)
        const deckId = params.get('id')

        const deckTitleEl = document.getElementById('deck-title')
        const backLink = document.getElementById('back-link')
        const studyArea = document.getElementById('study-area')
        const progressEl = document.getElementById('progress')
        const flashcard = document.getElementById('flashcard')
        const cardFrontText = document.getElementById('card-front-text')
        const cardBackText = document.getElementById('card-back-text')
        const hint = document.getElementById('hint')
        const answerButtons = document.getElementById('answer-buttons')
        const knowBtn = document.getElementById('know-btn')
        const dontKnowBtn = document.getElementById('dont-know-btn')
        const doneMessage = document.getElementById('done-message')
        const favoriteBtn = document.getElementById('favorite-btn')
        const commentsSection = document.getElementById('comments-section')
        const commentForm = document.getElementById('comment-form')
        const commentInput = document.getElementById('comment-input')
        const commentMessage = document.getElementById('comment-message')
        const commentsList = document.getElementById('comments-list')
        const practiceArea = document.getElementById('practice-area')
        const practiceMain = document.getElementById('practice-main')
        const practiceResult = document.getElementById('practice-result')
        const practiceProgressEl = document.getElementById('practice-progress')
        const practiceScoreEl = document.getElementById('practice-score')
        const practiceWordEl = document.getElementById('practice-word')
        const practiceOptionsEl = document.getElementById('practice-options')
        const practiceFeedbackEl = document.getElementById('practice-feedback')
        const practiceNextBtn = document.getElementById('practice-next-btn')
        const practiceBtnTop = document.getElementById('practice-btn-top')


        let allCards = []        // 词卡集里的全部卡片（不变）
        let cards = []           // 当前这一轮要过的卡片
        let currentIndex = 0
        let showingFront = true
        let knownCount = 0
        let unknownCount = 0
        let unknownCards = []    // 本轮标记“不会”的卡片
        let deckShuffle = false
        let isFavorite = false

        backLink.href = `deck.html?id=${deckId}`

        async function init() {
            // deck、cards、收藏状态三者互不依赖，可以并行
            const [deckResult, cardsResult, recordResult] = await Promise.all([
                supabase.from('decks').select('title, user_id, shuffle').eq('id', deckId).single(),
                supabase.from('cards').select('*').eq('deck_id', deckId),
                supabase.from('learning_records').select('status').eq('user_id', currentUser.id).eq('deck_id', deckId).maybeSingle()
            ])

            const deck = deckResult.data
            const cardsData = cardsResult.data
            const cardsError = cardsResult.error
            const record = recordResult.data

            if (deck) {
                deckTitleEl.textContent = deck.title
                deckShuffle = deck.shuffle ?? false
            }

            if (currentUser.id !== deck?.user_id) {
                backLink.href = 'index.html'
                backLink.textContent = '← Back to Home'
            } else {
                backLink.href = `deck.html?id=${deckId}`
            }

            if (cardsError) {
                deckTitleEl.textContent = 'Failed to load: ' + cardsError.message
                return
            }

            if (!cardsData || cardsData.length === 0) {
                deckTitleEl.textContent = 'This deck has no cards yet'
                return
            }

            allCards = cardsData

            isFavorite = record?.status === 'favorite'
            updateFavoriteBtn()

            // 总词数 >= 4 时，学习界面就显示练习入口
            if (allCards.length >= 4) {
                practiceBtnTop.style.display = 'inline-block'
            }

            // “记录学过”不阻塞学习，放最后，不用 await
            supabase
                .from('learning_records')
                .upsert({
                    user_id: currentUser.id,
                    deck_id: deckId,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id,deck_id' })

            startRound(allCards)
        }

        /* ==================== 练习模式 ==================== */

        let practiceQuestions = []   // 本轮题目对应的卡片（打乱后）
        let practiceIndex = 0
        let practiceCorrect = 0
        let practiceAnswered = false
        let practiceFrom = 'done'

        // 洗牌（Fisher-Yates）
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1))
                    ;[arr[i], arr[j]] = [arr[j], arr[i]]
            }
            return arr
        }

        // 根据一张卡片生成一道题：题干是 front，选项是 1 个正确 back + 3 个其它卡片 back
        function buildQuestion(card) {
            const correctBack = card.back
            const uniqueBacks = [...new Set(allCards.map(c => c.back))]
                .filter(b => b !== correctBack)

            const distractors = shuffle([...uniqueBacks])
                .slice(0, 3)
                .map(t => ({ text: t, correct: false }))

            const options = shuffle([
                { text: correctBack, correct: true },
                ...distractors
            ])

            return { card, options }
        }

        function startPractice(from = 'done') {
            practiceFrom = from

            practiceQuestions = shuffle([...allCards])
            practiceIndex = 0
            practiceCorrect = 0
            practiceAnswered = false

            studyArea.style.display = 'none'
            doneMessage.style.display = 'none'
            commentsSection.style.display = 'none'
            practiceArea.style.display = 'block'

            practiceMain.style.display = 'block'
            practiceResult.style.display = 'none'
            practiceResult.innerHTML = ''

            showPracticeQuestion()
        }

        function showPracticeQuestion() {
            practiceAnswered = false

            const q = practiceQuestions[practiceIndex]
            const question = buildQuestion(q)

            practiceProgressEl.textContent = `${practiceIndex + 1} / ${practiceQuestions.length}`
            practiceScoreEl.textContent = `Correct: ${practiceCorrect}`
            practiceWordEl.textContent = q.front

            // 渲染选项
            practiceOptionsEl.innerHTML = ''
            question.options.forEach(opt => {
                const btn = document.createElement('button')
                btn.type = 'button'
                btn.className = 'practice-option'
                btn.textContent = opt.text
                btn.dataset.correct = opt.correct ? '1' : '0'
                btn.addEventListener('click', () => selectPracticeOption(btn, opt.correct))
                practiceOptionsEl.appendChild(btn)
            })

            // 清空反馈
            practiceFeedbackEl.textContent = ''
            practiceFeedbackEl.className = 'practice-feedback'
            practiceNextBtn.style.display = 'none'
            practiceNextBtn.textContent =
                practiceIndex === practiceQuestions.length - 1 ? 'See results' : 'Next question'
        }

        function selectPracticeOption(btnEl, isCorrect) {
            if (practiceAnswered) return
            practiceAnswered = true

            // 标记所有选项
            practiceOptionsEl.querySelectorAll('.practice-option').forEach(btn => {
                btn.disabled = true
                if (btn.dataset.correct === '1') {
                    btn.classList.add('correct')
                } else if (btn === btnEl) {
                    btn.classList.add('wrong')
                }
            })

            if (isCorrect) {
                practiceCorrect++
                practiceFeedbackEl.textContent = 'Correct!'
                practiceFeedbackEl.className = 'practice-feedback correct'
            } else {
                const correctAnswer = practiceQuestions[practiceIndex].back
                practiceFeedbackEl.textContent = `Wrong. Correct answer: ${correctAnswer}`
                practiceFeedbackEl.className = 'practice-feedback wrong'
            }

            practiceScoreEl.textContent = `Correct: ${practiceCorrect}`
            practiceNextBtn.style.display = 'inline-block'
        }

        function nextPracticeQuestion() {
            practiceIndex++
            if (practiceIndex >= practiceQuestions.length) {
                showPracticeDone()
            } else {
                showPracticeQuestion()
            }
        }

        function showPracticeDone() {
            practiceMain.style.display = 'none'
            practiceResult.style.display = 'block'

            const total = practiceQuestions.length
            const rate = Math.round((practiceCorrect / total) * 100)

            let emoji = '📚'
            if (rate >= 90) emoji = '🎉'
            else if (rate >= 70) emoji = '👍'
            else if (rate >= 50) emoji = '💪'

            practiceResult.innerHTML = `
                <div class="practice-done-emoji">${emoji}</div>
                <h2>Practice complete!</h2>
                <p class="practice-done-score">${practiceCorrect} / ${total} correct</p>
                <p class="practice-done-rate">${rate}%</p>
                <div class="practice-done-actions">
                    <button id="practice-again-btn">Practice again</button>
                    <button id="practice-back-btn" class="btn-secondary">Back</button>
                </div>
            `

            document.getElementById('practice-again-btn')
                .addEventListener('click', startPractice)

            document.getElementById('practice-back-btn')
                .addEventListener('click', () => {
                    practiceArea.style.display = 'none'
                    practiceResult.style.display = 'none'
                    practiceMain.style.display = 'block'

                    if (practiceFrom === 'study') {
                        // 从学习界面进来的，回学习界面
                        studyArea.style.display = 'block'
                    } else {
                        // 从完成界面进来的，回完成界面 + 评论区
                        doneMessage.style.display = 'block'
                        commentsSection.style.display = 'block'
                    }
                })
        }

        practiceBtnTop?.addEventListener('click', () => startPractice('study'))

        // 只绑定一次
        practiceNextBtn?.addEventListener('click', nextPracticeQuestion)

        // 开始一轮学习，传入这一轮要过的卡片数组
        function startRound(cardList) {
            cards = [...cardList]

            if (deckShuffle) {
                for (let i = cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1))
                        ;[cards[i], cards[j]] = [cards[j], cards[i]]
                }
            }

            currentIndex = 0
            knownCount = 0
            unknownCount = 0
            unknownCards = []
            doneMessage.style.display = 'none'
            studyArea.style.display = 'block'
            practiceArea.style.display = 'none'
            showCard()
        }

        function showCard() {
            const card = cards[currentIndex]
            showingFront = true

            cardFrontText.textContent = card.front
            cardBackText.textContent = card.back

            // 切到下一张时“瞬间”回到正面，避免看到翻回去的动画
            flashcard.classList.add('no-transition')
            flashcard.classList.remove('flipped')
            void flashcard.offsetWidth   // 强制重排，让 no-transition 立即生效
            flashcard.classList.remove('no-transition')

            hint.textContent = 'Click the card to flip'
            answerButtons.style.display = 'none'
            progressEl.textContent = `${currentIndex + 1} / ${cards.length}`
        }

        flashcard.addEventListener('click', () => {
            if (showingFront) {
                flashcard.classList.add('flipped')
                hint.textContent = 'Do you know this card?'
                answerButtons.style.display = 'block'
            } else {
                flashcard.classList.remove('flipped')
                hint.textContent = 'Click the card to flip'
                answerButtons.style.display = 'none'
            }
            showingFront = !showingFront
        })

        function updateFavoriteBtn() {
            favoriteBtn.textContent = isFavorite ? 'Favorited' : 'Favorite'
        }

        favoriteBtn.addEventListener('click', async () => {
            const newStatus = isFavorite ? 'learning' : 'favorite'

            const { error } = await supabase
                .from('learning_records')
                .upsert({
                    user_id: currentUser.id,
                    deck_id: deckId,
                    status: newStatus,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id,deck_id' })

            if (error) {
                alert('Operation failed: ' + error.message)
                return
            }

            isFavorite = !isFavorite
            updateFavoriteBtn()
        })

        function nextCard(known) {
            if (known) {
                knownCount++
            } else {
                unknownCount++
                unknownCards.push(cards[currentIndex])
            }

            currentIndex++
            if (currentIndex >= cards.length) {
                showDone()
            } else {
                showCard()
            }
        }

        function showDone() {
            studyArea.style.display = 'none'
            doneMessage.style.display = 'block'

            let html = `<p>Done! ${cards.length} cards this round · ${knownCount} known · ${unknownCount} unknown.</p>`
            html += `<button id="restart-all-btn">Study all again</button>`

            if (unknownCards.length > 0) {
                html += `<button id="review-unknown-btn">Review unknown (${unknownCards.length})</button>`
            }

            // 新增：练习模式入口，总词数 >= 4 才显示
            if (allCards.length >= 4) {
                html += `<button id="practice-btn" class="practice-btn">Practice mode</button>`
            }

            html += `<a href="index.html">Back to home</a>`
            doneMessage.innerHTML = html

            document.getElementById('restart-all-btn').addEventListener('click', () => {
                startRound(allCards)
            })

            const reviewBtn = document.getElementById('review-unknown-btn')
            if (reviewBtn) {
                reviewBtn.addEventListener('click', () => {
                    startRound(unknownCards)
                })
            }

            // 新增：绑定练习按钮
            const practiceBtn = document.getElementById('practice-btn')
            if (practiceBtn) {
                practiceBtn.addEventListener('click', () => startPractice('done'))
            }

            commentsSection.style.display = 'block'
            loadComments()
        }

        /* ==================== 评论功能 ==================== */

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]))
        }

        // 简单相对时间
        function formatTime(iso) {
            const d = new Date(iso)
            const diff = (Date.now() - d.getTime()) / 1000
            if (diff < 60) return 'Just now'
            if (diff < 3600) return `${Math.floor(diff / 60)} minutes ago`
            if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`
            if (diff < 86400 * 7) return `${Math.floor(diff / 86400)} days ago`
            return d.toLocaleDateString('zh-CN')
        }

        async function loadComments() {
            commentsList.textContent = 'Loading...'

            const { data, error } = await supabase
                .from('comments')
                .select('id, content, created_at, user_id, profiles(username)')
                .eq('deck_id', deckId)
                .order('created_at', { ascending: false })

            if (error) {
                commentsList.textContent = 'Failed to load: ' + error.message
                return
            }

            if (data.length === 0) {
                commentsList.innerHTML =
                    '<p class="comments-empty">No comments yet, be the first to comment!</p>'
                return
            }

            commentsList.innerHTML = data.map(c => {
                const name = c.profiles?.username || '匿名'
                const mine = c.user_id === currentUser.id
                const deleteBtn = mine
                    ? `<button class="delete-comment-btn" data-id="${c.id}">Delete</button>`
                    : ''

                return `
                    <div class="comment-item" data-id="${c.id}">
                        <div class="comment-head">
                            <a class="comment-author"
                            href="profile.html?user=${c.user_id}">${escapeHtml(name)}</a>
                            <span class="comment-time">${formatTime(c.created_at)}</span>
                            ${deleteBtn}
                        </div>
                        <div class="comment-body">${escapeHtml(c.content)}</div>
                    </div>
                `
            }).join('')

            commentsList.querySelectorAll('.delete-comment-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteComment(btn.dataset.id))
            })
        }

        async function deleteComment(commentId) {
            if (!confirm('Are you sure you want to delete this comment?')) return

            const { error } = await supabase
                .from('comments')
                .delete()
                .eq('id', commentId)

            if (error) {
                alert('Failed to delete: ' + error.message)
                return
            }
            loadComments()
        }

        commentForm?.addEventListener('submit', async (e) => {
            e.preventDefault()
            const content = commentInput.value.trim()
            if (!content) return

            commentMessage.textContent = 'Posting...'

            const { error } = await supabase
                .from('comments')
                .insert({
                    deck_id: deckId,
                    user_id: currentUser.id,
                    content
                })

            if (error) {
                commentMessage.textContent = 'Failed to post: ' + error.message
                return
            }

            commentMessage.textContent = ''
            commentInput.value = ''
            loadComments()
        })

        knowBtn.addEventListener('click', () => nextCard(true))
        dontKnowBtn.addEventListener('click', () => nextCard(false))

        init()
    </script>
</body>

</html>
