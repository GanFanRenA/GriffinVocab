<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词卡教学网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>词卡教学网站</h1>
        <div id="user-area">
            <span id="user-email"></span>
            <button id="logout-btn">登出</button>
        </div>
    </header>

    <section id="create-section" style="display:none;">
        <h2>创建词卡集</h2>
        <form id="create-deck-form">
            <input type="text" id="deck-title" placeholder="词卡集标题，如：水果词汇" required>
            <label>
                <input type="checkbox" id="deck-shuffle"> 学习时随机打乱
            </label>
            <button type="submit">创建</button>
        </form>
        <p id="create-message"></p>
    </section>

    <section>
        <h2>所有词卡集</h2>
        <input type="text" id="search-input" placeholder="搜索标题或作者...">
        <div id="decks-list">加载中...</div>
    </section>

    <script type="module">
        
       import { supabase, requireLogin, logout } from './script.js'

        const currentUser = await requireLogin()
        if (!currentUser) throw new Error('未登录，正在跳转')

        const userArea = document.getElementById('user-area')
        const userEmail = document.getElementById('user-email')
        const logoutBtn = document.getElementById('logout-btn')
        const createSection = document.getElementById('create-section')
        const createForm = document.getElementById('create-deck-form')
        const deckTitle = document.getElementById('deck-title')
        const createMessage = document.getElementById('create-message')
        const decksList = document.getElementById('decks-list')

        userEmail.textContent = currentUser.email
        createSection.style.display = 'block'

        // 登出
        logoutBtn?.addEventListener('click', async () => {
            await logout()
        })

        // 创建词卡集
        createForm?.addEventListener('submit', async (e) => {
            e.preventDefault()
            createMessage.textContent = '创建中...'

            const { error } = await supabase
                .from('decks')
                .insert({
                    title: deckTitle.value,
                    user_id: currentUser.id,
                    shuffle: document.getElementById('deck-shuffle').checked,
                    author_name: currentUser.email.split('@')[0]
                })

            if (error) {
                createMessage.textContent = '出错了：' + error.message
                return
            }

            createMessage.textContent = '创建成功'
            deckTitle.value = ''
            loadDecks()
        })

        document.getElementById('search-input').addEventListener('input', (e) => {
            const keyword = e.target.value.trim().toLowerCase()

            if (!keyword) {
                renderDecks(allDecks)
                return
            }

            const filtered = allDecks.filter(deck => {
                const title = (deck.title || '').toLowerCase()
                const author = (deck.author_name || '').toLowerCase()
                return title.includes(keyword) || author.includes(keyword)
            })

            renderDecks(filtered)
        })

        let allDecks = []

        async function loadDecks() {
            const { data, error } = await supabase
                .from('decks')
                .select('*, cards(count)')
                .order('created_at', { ascending: false })

            if (error) {
                decksList.textContent = '加载失败：' + error.message
                return
            }

            allDecks = data
            renderDecks(allDecks)
        }

        function renderDecks(decks) {
            if (decks.length === 0) {
                decksList.textContent = '没有找到匹配的词卡集。'
                return
            }

            decksList.innerHTML = decks.map(deck => {
                const isOwner = deck.user_id === currentUser.id
                const target = isOwner
                    ? `deck.html?id=${deck.id}`
                    : `study.html?id=${deck.id}`

                const cardCount = deck.cards?.[0]?.count ?? 0
                const author = deck.author_name || '匿名'

                return `
                    <div class="deck-item">
                        <a href="${target}">${deck.title}</a>
                        <div class="deck-meta">
                            作者：${author} · ${cardCount} 张卡片
                        </div>
                    </div>
                `
            }).join('')
        }

        loadDecks()
    </script>
</body>
</html>
