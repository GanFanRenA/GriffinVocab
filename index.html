<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词卡教学网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>词卡教学网站</h1>
        <div id="user-area">
            <span id="user-email"></span>
            <button id="logout-btn">登出</button>
        </div>
    </header>

    <section id="create-section" style="display:none;">
        <h2>创建词卡集</h2>
        <form id="create-deck-form">
            <input type="text" id="deck-title" placeholder="词卡集标题，如：水果词汇" required>
            <button type="submit">创建</button>
        </form>
        <p id="create-message"></p>
    </section>

    <section>
        <h2>所有词卡集</h2>
        <div id="decks-list">加载中...</div>
    </section>

    <script type="module">
        
       import { supabase, requireLogin, logout } from './script.js'

        const currentUser = await requireLogin()
        if (!currentUser) throw new Error('未登录，正在跳转')

        const userArea = document.getElementById('user-area')
        const userEmail = document.getElementById('user-email')
        const logoutBtn = document.getElementById('logout-btn')
        const createSection = document.getElementById('create-section')
        const createForm = document.getElementById('create-deck-form')
        const deckTitle = document.getElementById('deck-title')
        const createMessage = document.getElementById('create-message')
        const decksList = document.getElementById('decks-list')

        userEmail.textContent = currentUser.email
        createSection.style.display = 'block'

        // 登出
        logoutBtn?.addEventListener('click', async () => {
            await logout()
        })

        // 创建词卡集
        createForm?.addEventListener('submit', async (e) => {
            e.preventDefault()
            createMessage.textContent = '创建中...'

            const { error } = await supabase
                .from('decks')
                .insert({ title: deckTitle.value, user_id: currentUser.id })

            if (error) {
                createMessage.textContent = '出错了：' + error.message
                return
            }

            createMessage.textContent = '创建成功'
            deckTitle.value = ''
            loadDecks()
        })

        // 加载所有词卡集
        async function loadDecks() {
            const { data, error } = await supabase
                .from('decks')
                .select('*')
                .order('created_at', { ascending: false })

            if (error) {
                decksList.textContent = '加载失败：' + error.message
                return
            }

            if (data.length === 0) {
                decksList.textContent = '还没有词卡集，登录后创建一个吧。'
                return
            }

            decksList.innerHTML = data.map(deck => `
                <div class="deck-item">
                    <a href="deck.html?id=${deck.id}">${deck.title}</a>
                </div>
            `).join('')
        }

        loadDecks()
    </script>
</body>
</html>
