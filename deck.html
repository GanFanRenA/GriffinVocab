<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词卡集详情</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p><a href="index.html">← 返回首页</a></p>

    <h1 id="deck-title">加载中...</h1>
    
    <div id="deck-actions" style="display:none;">
        <button id="edit-deck-btn">编辑标题</button>
        <p id="deck-subject-unit"></p>
        <button id="toggle-shuffle-btn">切换打乱设置</button>
        <button id="delete-deck-btn">删除词卡集</button>
    </div>

    <p><a id="study-link" href="#">开始学习 →</a></p>

    <section id="add-card-section" style="display:none;">
        <h2>添加单词卡</h2>
        <form id="add-card-form">
            <input type="text" id="card-front" placeholder="正面，如：苹果" required>
            <input type="text" id="card-back" placeholder="背面，如：apple" required>
            <button type="submit">添加</button>
        </form>
        <p id="card-message"></p>
    </section>

    <section>
        <h2>单词卡列表</h2>
        <div id="cards-list">加载中...</div>
    </section>

    <script type="module">
        
        import { supabase, requireLogin } from './script.js'

        const currentUser = await requireLogin()
        if (!currentUser) throw new Error('未登录，正在跳转')

        const params = new URLSearchParams(window.location.search)
        const deckId = params.get('id')

        const deckTitleEl = document.getElementById('deck-title')
        const addCardSection = document.getElementById('add-card-section')
        const addCardForm = document.getElementById('add-card-form')
        const cardFront = document.getElementById('card-front')
        const cardBack = document.getElementById('card-back')
        const cardMessage = document.getElementById('card-message')
        const cardsList = document.getElementById('cards-list')

        let deckOwnerId = null
        let deckShuffle = false
        let deckUnit = ''  

        async function init() {
            // 加载词卡集信息
            const { data: deck } = await supabase
                .from('decks')
                .select('*, subjects(name)')
                .eq('id', deckId)
                .single()

            deckUnit = deck.unit
            const subjectName = deck.subjects?.name || '未分类'
            document.getElementById('deck-subject-unit').textContent = `学科：${subjectName} · 单元：${deckUnit}`
            
            if (!deck) {
                deckTitleEl.textContent = '加载失败：未找到该词卡集'
                return
            }

            deckOwnerId = deck.user_id
            deckTitleEl.textContent = deck.title
            deckShuffle = deck.shuffle ?? false

            updateShuffleBtn()

            document.getElementById('study-link').href = `study.html?id=${deckId}`
            addCardSection.style.display = 'block'
            document.getElementById('deck-actions').style.display = 'block'
            loadCards()
        }

        // 编辑词卡集标题
        document.getElementById('edit-deck-btn')?.addEventListener('click', async () => {
            const newTitle = prompt('新的标题：', deckTitleEl.textContent)
            if (!newTitle) return

            const { error } = await supabase
                .from('decks')
                .update({ title: newTitle })
                .eq('id', deckId)

            if (error) {
                alert('修改失败：' + error.message)
                return
            }
            deckTitleEl.textContent = newTitle
        })

        // 显示当前打乱设置
        function updateShuffleBtn() {
            const btn = document.getElementById('toggle-shuffle-btn')
            if (btn) {
                btn.textContent = deckShuffle ? '打乱：开' : '打乱：关'
            }
        }

        // 切换
        document.getElementById('toggle-shuffle-btn')?.addEventListener('click', async () => {
            const newValue = !deckShuffle

            const { error } = await supabase
                .from('decks')
                .update({ shuffle: newValue })
                .eq('id', deckId)

            if (error) {
                alert('修改失败：' + error.message)
                return
            }

            deckShuffle = newValue
            updateShuffleBtn()
        })

        // 删除词卡集
        document.getElementById('delete-deck-btn')?.addEventListener('click', async () => {
            if (!confirm('确定删除这个词卡集？里面的所有单词卡也会一起删除。')) return

            const { error } = await supabase
                .from('decks')
                .delete()
                .eq('id', deckId)

            if (error) {
                alert('删除失败：' + error.message)
                return
            }
            window.location.href = 'index.html'
        })

        // 编辑单词卡
        async function editCard(cardId) {
            const newFront = prompt('新的正面：')
            if (newFront === null) return
            const newBack = prompt('新的背面：')
            if (newBack === null) return

            const { error } = await supabase
                .from('cards')
                .update({ front: newFront, back: newBack })
                .eq('id', cardId)

            if (error) {
                alert('修改失败：' + error.message)
                return
            }
            loadCards()
        }

        // 删除单词卡
        async function deleteCard(cardId) {
            if (!confirm('确定删除这张单词卡？')) return

            const { error } = await supabase
                .from('cards')
                .delete()
                .eq('id', cardId)

            if (error) {
                alert('删除失败：' + error.message)
                return
            }
            loadCards()
        }

        // 添加单词卡（自动追加到末尾）
        addCardForm?.addEventListener('submit', async (e) => {
            e.preventDefault()
            cardMessage.textContent = '添加中...'

            // 查出当前最大 position
            const { data: lastCard } = await supabase
                .from('cards')
                .select('position')
                .eq('deck_id', deckId)
                .order('position', { ascending: false })
                .limit(1)
                .maybeSingle()

            const newPosition = (lastCard?.position ?? -1) + 1

            const { error } = await supabase
                .from('cards')
                .insert({
                    deck_id: deckId,
                    front: cardFront.value,
                    back: cardBack.value,
                    position: newPosition
                })

            if (error) {
                cardMessage.textContent = '出错了：' + error.message
                return
            }

            cardMessage.textContent = '添加成功'
            cardFront.value = ''
            cardBack.value = ''
            loadCards()
        })

        // HTML 转义，防止单词里的特殊字符破坏结构
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]))
        }

        // 加载单词卡（按 position 排序）
        async function loadCards() {
            const { data, error } = await supabase
                .from('cards')
                .select('*')
                .eq('deck_id', deckId)
                .order('position', { ascending: true })

            if (error) {
                cardsList.textContent = '加载失败：' + error.message
                return
            }

            if (data.length === 0) {
                cardsList.textContent = '还没有单词卡。'
                return
            }

            cardsList.innerHTML = data.map(card => `
                <div class="card-item" draggable="true" data-id="${card.id}">
                    <div class="card-main">
                        <span class="drag-handle" title="拖动调整顺序">⋮⋮</span>
                        <span class="card-text">
                            <strong>${esc(card.front)}</strong> → ${esc(card.back)}
                        </span>
                    </div>
                    <div class="card-actions">
                        <button class="edit-card-btn" data-id="${card.id}">编辑</button>
                        <button class="delete-card-btn" data-id="${card.id}">删除</button>
                    </div>
                </div>
            `).join('')

            // 绑定编辑 / 删除事件
            document.querySelectorAll('.edit-card-btn').forEach(btn => {
                btn.addEventListener('click', () => editCard(btn.dataset.id))
            })
            document.querySelectorAll('.delete-card-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteCard(btn.dataset.id))
            })
        }

        /* ==================== 拖拽排序 ==================== */

        let draggedCardId = null
        let orderDirty = false

        // 拖动开始
        cardsList.addEventListener('dragstart', (e) => {
            const item = e.target.closest('.card-item')
            if (!item) return
            draggedCardId = item.dataset.id
            orderDirty = true
            item.classList.add('dragging')
            e.dataTransfer.effectAllowed = 'move'
            // Firefox 必须调用 setData 才会启动拖拽
            e.dataTransfer.setData('text/plain', draggedCardId)
        })

        // 拖动经过：实时把被拖项移到鼠标位置对应的槽位
        cardsList.addEventListener('dragover', (e) => {
            e.preventDefault()
            e.dataTransfer.dropEffect = 'move'

            const dragging = cardsList.querySelector('.card-item.dragging')
            if (!dragging) return

            const after = getDragAfterElement(cardsList, e.clientY)
            if (after == null) {
                cardsList.appendChild(dragging)
            } else if (after !== dragging) {
                cardsList.insertBefore(dragging, after)
            }
        })

        // 拖动结束：清理样式，写回数据库
        cardsList.addEventListener('dragend', async () => {
            const dragging = cardsList.querySelector('.card-item.dragging')
            if (dragging) dragging.classList.remove('dragging')

            if (orderDirty && draggedCardId) {
                orderDirty = false
                draggedCardId = null
                await persistOrder()
            }
        })

        // 找到鼠标 Y 坐标下方“最近的、非拖拽中”的元素
        function getDragAfterElement(container, y) {
            const items = [...container.querySelectorAll('.card-item:not(.dragging)')]
            return items.reduce((closest, child) => {
                const box = child.getBoundingClientRect()
                const offset = y - box.top - box.height / 2
                if (offset < 0 && offset > closest.offset) {
                    return { offset, element: child }
                }
                return closest
            }, { offset: Number.NEGATIVE_INFINITY, element: null }).element
        }

        // 把 DOM 中的顺序写回数据库
        async function persistOrder() {
            const items = [...cardsList.querySelectorAll('.card-item')]

            const results = await Promise.all(
                items.map((el, i) =>
                    supabase
                        .from('cards')
                        .update({ position: i })
                        .eq('id', el.dataset.id)
                )
            )

            const failed = results.find(r => r.error)
            if (failed) {
                alert('保存顺序失败：' + failed.error.message)
                loadCards() // 重新拉取，恢复服务端顺序
            }
        }

        init()
    </script>
</body>
</html>
