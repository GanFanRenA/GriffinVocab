<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p><a href="index.html">← Back to Home</a></p>

    <h1>Account Settings</h1>

    <form id="username-form">
        <label>Display Name</label>
        <input type="text" id="username" required>
        <button type="submit">Save</button>
    </form>
    <p id="message"></p>

    <script type="module">
        import { supabase, requireLogin } from './script.js'

        const currentUser = await requireLogin()
        if (!currentUser) throw new Error('Not logged in, redirecting...')

        const form = document.getElementById('username-form')
        const usernameInput = document.getElementById('username')
        const message = document.getElementById('message')

        // 加载当前用户名
        const { data: profile } = await supabase
            .from('profiles')
            .select('username')
            .eq('id', currentUser.id)
            .single()

        if (profile) usernameInput.value = profile.username

        form.addEventListener('submit', async (e) => {
            e.preventDefault()
            message.textContent = 'Saving...'

            const newName = usernameInput.value.trim()
            if (!newName) {
                message.textContent = 'Name cannot be empty'
                return
            }

            const { error } = await supabase
                .from('profiles')
                .update({ username: newName })
                .eq('id', currentUser.id)

            if (error) {
                if (error.code === '23505') {
                    message.textContent = 'This name is already taken'
                } else {
                    message.textContent = 'Failed to save: ' + error.message
                }
                return
            }

            message.textContent = 'Saved successfully'
        })
    </script>
</body>
</html>
